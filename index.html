<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="今この瞬間の気持ちを嘘発見機のように計測し、フラクタル模様でイメージ化するツール。" />
  <title>RIGHT NOW // 心の計測</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="dot live"></span>
      <span class="brand-name">RIGHT&nbsp;NOW</span>
      <span class="brand-sub">PSYCHO-METER // SYS.01</span>
    </div>
    <div class="topbar-right">
      <span id="clock" class="clock">--:--:--</span>
      <span class="status">STANDBY</span>
    </div>
  </header>

  <main id="app">
    <!-- ヒーロー -->
    <section id="screen-hero" class="screen active">
      <div class="hero-inner">
        <h1 class="hero-title">
          <span class="hl">今この瞬間</span>の、
          <br />心の<span class="hl">波形</span>を測る。
        </h1>
        <p class="hero-desc">
          いくつかの質問に答えるだけで、あなたの「いま」を
          嘘発見機のグラフとフラクタル模様として描き出します。
        </p>
        <canvas id="hero-canvas" class="hero-canvas" width="520" height="160"></canvas>
        <button id="btn-start" class="btn primary">計測を開始する</button>
      </div>
    </section>

    <!-- 質問 -->
    <section id="screen-quiz" class="screen">
      <div class="quiz-progress">
        <span id="quiz-index">01</span>
        <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
        <span id="quiz-total">05</span>
      </div>
      <div class="quiz-card">
        <h2 id="quiz-label" class="quiz-label"></h2>
        <p id="quiz-question" class="quiz-question"></p>
        <div class="range-wrap">
          <div class="range-scale">
            <span id="quiz-min" class="scale-min"></span>
            <input id="quiz-slider" type="range" min="0" max="100" value="50" step="1" />
            <span id="quiz-max" class="scale-max"></span>
          </div>
          <div id="quiz-value" class="quiz-value">50</div>
        </div>
        <div class="quiz-nav">
          <button id="btn-prev" class="btn ghost">戻る</button>
          <button id="btn-next" class="btn primary">次へ</button>
        </div>
      </div>
    </section>

    <!-- 生成中 -->
    <section id="screen-anim" class="screen">
      <div class="anim-wrap">
        <canvas id="anim-canvas" class="anim-canvas"></canvas>
        <div class="anim-overlay">
          <div class="anim-label">ANALYZING CURRENT STATE...</div>
          <div class="anim-readout" id="anim-readout"></div>
        </div>
      </div>
    </section>

    <!-- 結果 -->
    <section id="screen-result" class="screen">
      <div class="result-grid">
        <div class="result-panel graph-panel">
          <div class="panel-head">
            <span class="panel-title">WAVEFORM // 波形</span>
            <span class="panel-id" id="result-seed">SEED------</span>
          </div>
          <canvas id="graph-canvas" class="graph-canvas"></canvas>
        </div>
        <div class="result-panel fractal-panel">
          <div class="panel-head">
            <span class="panel-title">GEOMETRIC // フラクタル</span>
          </div>
          <canvas id="fractal-canvas" class="fractal-canvas"></canvas>
        </div>
      </div>
      <div class="result-actions">
        <button id="btn-reload" class="btn ghost">再計測</button>
        <button id="btn-share" class="btn primary">URLをコピー</button>
      </div>
      <p id="share-msg" class="share-msg"></p>
    </section>
  </main>

  <footer class="foot">RIGHT NOW // generated by the present mind</footer>

  <script src="questions.js"></script>
  <script src="render/graph.js"></script>
  <script src="render/fractal.js"></script>
  <script src="render/anim.js"></script>
  <script src="app.js"></script>
</body>
</html>
